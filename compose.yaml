name: netfilter-lab

services:
  router:
    container_name: router
    build:
      context: .
      dockerfile: base/Dockerfile
    image: netfilter-lab:local
    hostname: router
    entrypoint: ["/usr/local/sbin/router-entrypoint"]
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
      - "${HTTPS_PUBLISH_PORT:-8443}:8443"
    networks:
      client_net:
        ipv4_address: 172.16.0.1
      server_net:
        ipv4_address: 172.24.0.1
    restart: unless-stopped

  dhcp:
    container_name: dhcp
    image: netfilter-lab:local
    hostname: dhcp
    entrypoint: ["/usr/local/sbin/dhcp-entrypoint"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./dnsmasq/lab.conf:/etc/dnsmasq.d/lab.conf:ro
      - dnsmasq-leases:/var/lib/misc
    networks:
      client_net:
        ipv4_address: 172.16.0.2
    healthcheck:
      test: ["CMD", "dig", "@172.16.0.2", "web.lab.test", "+short"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  proxy:
    container_name: proxy
    image: netfilter-lab:local
    hostname: proxy
    entrypoint: ["/usr/local/sbin/proxy-entrypoint"]
    depends_on:
      - server1
      - server2
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - tls-certs:/etc/nginx/certs
      - acme-webroot:/var/www/certbot:ro
    networks:
      server_net:
        ipv4_address: 172.24.0.10
    restart: unless-stopped

  server1:
    container_name: server1
    image: netfilter-lab:local
    hostname: server1
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./web/web1.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      server_net:
        ipv4_address: 172.24.0.11
    restart: unless-stopped

  server2:
    container_name: server2
    image: netfilter-lab:local
    hostname: server2
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./web/web2.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      server_net:
        ipv4_address: 172.24.0.12
    restart: unless-stopped

  client:
    container_name: client
    image: netfilter-lab:local
    hostname: client
    entrypoint: ["/usr/local/sbin/client-entrypoint"]
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      router:
        condition: service_started
      dhcp:
        condition: service_healthy
      proxy:
        condition: service_started
    networks:
      client_net:
    restart: unless-stopped

  certbot:
    image: netfilter-lab:local
    profiles: ["certbot"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test "$$ACME_DOMAIN" != "example.com" || { echo 'Set ACME_DOMAIN to your public DNS name.'; exit 1; };
        test "$$ACME_EMAIL" != "admin@example.com" || { echo 'Set ACME_EMAIL to your email address.'; exit 1; };
        certbot certonly --non-interactive --webroot -w /var/www/certbot
        --email "$$ACME_EMAIL" --agree-tos --no-eff-email -d "$$ACME_DOMAIN";
        cp "/etc/letsencrypt/live/$$ACME_DOMAIN/fullchain.pem" /etc/nginx/certs/fullchain.pem;
        cp "/etc/letsencrypt/live/$$ACME_DOMAIN/privkey.pem" /etc/nginx/certs/privkey.pem;
        chmod 644 /etc/nginx/certs/fullchain.pem;
        chmod 600 /etc/nginx/certs/privkey.pem;
    environment:
      ACME_DOMAIN: ${ACME_DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - tls-certs:/etc/nginx/certs
      - acme-webroot:/var/www/certbot
    networks:
      - acme_egress

networks:
  client_net:
    name: netfilter-lab-client
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.254
          ip_range: 172.16.0.128/25
  server_net:
    name: netfilter-lab-server
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.254
  acme_egress:
    name: netfilter-lab-acme-egress

volumes:
  dnsmasq-leases:
  tls-certs:
  acme-webroot:
  letsencrypt: