interface=eth0
bind-interfaces
listen-address=172.16.0.2
log-dhcp
log-facility=-
no-resolv
no-hosts
domain-needed
bogus-priv
domain=lab.test
local=/lab.test/
address=/web.lab.test/172.16.0.1
address=/router.lab.test/172.16.0.1
dhcp-authoritative
dhcp-range=172.16.0.10,172.16.0.99,255.255.255.0,12h
dhcp-option=option:router,172.16.0.1
dhcp-option=option:dns-server,172.16.0.2
dhcp-option=option:domain-search,lab.test
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
